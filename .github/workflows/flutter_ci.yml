name: Flutter CI

on:
  push:
    branches: [ "master", "main", "dev", "production" ]
  pull_request:
    branches: [ "master", "main", "dev", "production" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run tests
        run: flutter test

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/firestore_rules

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/firestore_rules/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Test security rules against the Firestore emulator
        run: npm test
