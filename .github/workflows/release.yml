name: Release

# Builds a signed Android release each time something is merged into
# `production`, and publishes it as a GitHub release (AAB for Google Play,
# APK for direct install). See docs/release.md.
on:
  push:
    branches: [ "production" ]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # versionCode must always increase on Google Play; the run number does,
      # and the offset keeps it above the codes used before CI (pubspec +5).
      BUILD_NUMBER_OFFSET: 100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Check the signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          # Without them Gradle would sign with the debug key, which Play rejects.
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_SERVICES_JSON_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (see docs/release.md)"
              exit 1
            fi
          done

      - name: Write the Firebase config and the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
          } > android/key.properties

      - name: Check the Firebase config
        run: |
          # Google Sign-In on Android needs the web OAuth client (client_type 3),
          # which becomes `default_web_client_id`. An old google-services.json
          # without it builds fine but every Google sign-in fails.
          json=android/app/google-services.json
          if ! jq -e '[.client[].oauth_client[]? | select(.client_type == 3)] | length > 0' "$json" > /dev/null; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 has no web OAuth client (client_type 3): download google-services.json again from Firebase (see docs/release.md)"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Version
        id: version
        run: |
          name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          code=$((GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name+$code" >> "$GITHUB_OUTPUT"

      - name: Build the app bundle and the APK
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}

      - name: Check the signature
        run: |
          # Fails the release if the bundle is signed with a debug key.
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab \
            | tee signer.txt | grep -E "Owner:|SHA256:"
          if grep -q "CN=Android Debug" signer.txt; then
            echo "::error::The bundle is signed with the debug key"
            exit 1
          fi

      - name: Check the Google Sign-In config in the APK
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          apk=$(ls build/app/outputs/flutter-apk/*release*.apk | head -1)
          if ! "$aapt2" dump resources "$apk" | grep -q "string/default_web_client_id"; then
            echo "::error::The APK has no default_web_client_id: Google Sign-In would fail"
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          dir=build/app/outputs
          aab="$dir/knote-$TAG.aab"
          apk="$dir/knote-$TAG.apk"
          cp "$dir/bundle/release/app-release.aab" "$aab"
          cp "$(ls $dir/flutter-apk/*release*.apk | head -1)" "$apk"
          gh release create "$TAG" "$aab" "$apk" \
            --target "$GITHUB_SHA" \
            --title "K.Note $TAG" \
            --generate-notes

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" android/key.properties
